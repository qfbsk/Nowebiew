<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>grid</title>
<style>
.g { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; width:600px; background:#222; }
.c { background:#3b82f6; color:#fff; padding:8px; }
</style></head>
<body>
<div class="g"><div class="c">1</div><div class="c">2</div><div class="c">3</div><div class="c">4</div><div class="c">5</div><div class="c">6</div></div>
</body></html>
