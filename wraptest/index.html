<!DOCTYPE html>
<html><head><style>
  .box { width: 300px; background: #eee; margin: 20px; }
  p { font-size: 16px; color: #222; }
  .narrow { width: 120px; }
</style></head>
<body>
  <div class="box"><p>The quick brown fox jumps over the lazy dog and keeps running across the meadow until sunset arrives</p></div>
  <div class="box narrow"><p>Supercalifragilistic expialidocious word boundaries matter for typography</p></div>
</body></html>
