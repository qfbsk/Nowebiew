</style></head>

  <table>
    <tr><th>姓名</th><th>年龄</th><th>城市</th></tr>

    <tr><td>李四</td><td>35</td><td>上海</td></tr>
    <tr><td>王五</td><td>42</td><td>广州</td></tr>
  </table>
</body></html>
